<div class="home-container">
    <h1>Chào mừng bạn đến với MyShop!</h1>
    <p>Đây là trang chủ tạm thời.</p>

    <button (click)="callRefreshTokenApi()">Gọi API Refresh Token</button>

    <div *ngIf="loading">⏳ Đang gọi API...</div>
    <div *ngIf="error" style="color: red;">{{ error }}</div>

    <pre *ngIf="responseData">{{ responseData  }}</pre>
</div>
