<div class="auth-layout">
    <div class="auth-container">
        <h1 class="auth-title">Đăng nhập nhân viên</h1>

        <form [formGroup]="loginForm" (ngSubmit)="onSubmit()" class="auth-form">

            <!-- Email -->
            <mat-form-field appearance="outline" class="full-width">
                <mat-label>Email</mat-label>
                <input matInput formControlName="username" type="email" required placeholder="VD: email@company.com" />

                <mat-error *ngIf="loginForm.get('username')?.hasError('required')">
                    Vui lòng nhập email
                </mat-error>
                <mat-error *ngIf="loginForm.get('username')?.hasError('email')">
                    Email không đúng định dạng. Ví dụ: <strong>email&#64;company.com</strong>
                </mat-error>
            </mat-form-field>

            <!-- Password -->
            <mat-form-field appearance="outline" class="full-width">
                <mat-label>Mật khẩu</mat-label>
                <input matInput [type]="hide ? 'password' : 'text'" formControlName="password" required
                    placeholder="Tối thiểu 6 ký tự" />
                <button mat-icon-button matSuffix type="button" (click)="hide = !hide">
                    <mat-icon>{{ hide ? 'visibility_off' : 'visibility' }}</mat-icon>
                </button>

                <mat-error *ngIf="loginForm.get('password')?.hasError('required')">
                    Vui lòng nhập mật khẩu
                </mat-error>
                <mat-error *ngIf="loginForm.get('password')?.hasError('minlength')">
                    Mật khẩu phải có ít nhất 6 ký tự
                </mat-error>
            </mat-form-field>

            <!-- Button submit -->
            <button mat-raised-button color="primary" type="submit" [disabled]="loginForm.invalid"
                class="custom-login-btn">
                Đăng nhập
            </button>
        </form>

        <!-- Các liên kết phụ -->
        <div class="login-links">
            <p>
                Quên mật khẩu?
                <a routerLink="/auth/forgot-password">Khôi phục mật khẩu</a>
            </p>
            <p>
                Bạn là khách hàng?
                <a routerLink="/auth/login">Đăng nhập khách hàng</a>
            </p>
        </div>
    </div>
</div>
