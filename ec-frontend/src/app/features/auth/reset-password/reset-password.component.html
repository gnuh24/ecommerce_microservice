<div class="auth-layout">
    <div class="auth-container">
        <h1 class="auth-title">Đặt lại mật khẩu</h1>

        <form [formGroup]="resetForm" (ngSubmit)="onSubmit()" class="auth-form">

            <!-- OTP -->
            <mat-form-field appearance="outline" class="full-width">
                <mat-label>Mã OTP</mat-label>
                <input matInput formControlName="otp" type="text" required placeholder="Nhập mã OTP gồm 6 chữ số" />
                <mat-error *ngIf="resetForm.get('otp')?.hasError('required')">
                    Vui lòng nhập mã OTP
                </mat-error>
                <mat-error *ngIf="resetForm.get('otp')?.hasError('pattern')">
                    Mã OTP phải gồm đúng 6 chữ số
                </mat-error>
            </mat-form-field>

            <!-- Mật khẩu mới -->
            <mat-form-field appearance="outline" class="full-width">
                <mat-label>Mật khẩu mới</mat-label>
                <input matInput [type]="hide1 ? 'password' : 'text'" formControlName="newPassword" required
                    placeholder="Tối thiểu 6 ký tự" />
                <button mat-icon-button matSuffix type="button" (click)="hide1 = !hide1">
                    <mat-icon>{{ hide1 ? 'visibility_off' : 'visibility' }}</mat-icon>
                </button>
                <mat-error *ngIf="resetForm.get('newPassword')?.hasError('required')">
                    Vui lòng nhập mật khẩu mới
                </mat-error>
                <mat-error *ngIf="resetForm.get('newPassword')?.hasError('minlength')">
                    Mật khẩu phải có ít nhất 6 ký tự
                </mat-error>
            </mat-form-field>

            <!-- Nhập lại mật khẩu -->
            <mat-form-field appearance="outline" class="full-width">
                <mat-label>Nhập lại mật khẩu</mat-label>
                <input matInput [type]="hide2 ? 'password' : 'text'" formControlName="repeatNewPassword" required
                    placeholder="Nhập lại mật khẩu mới" />
                <button mat-icon-button matSuffix type="button" (click)="hide2 = !hide2">
                    <mat-icon>{{ hide2 ? 'visibility_off' : 'visibility' }}</mat-icon>
                </button>
                <mat-error *ngIf="resetForm.get('repeatNewPassword')?.hasError('required')">
                    Vui lòng nhập lại mật khẩu
                </mat-error>
                <mat-error *ngIf="resetForm.hasError('passwordMismatch')">
                    Mật khẩu không khớp
                </mat-error>
            </mat-form-field>


            <!-- Nút gửi lại OTP -->
            <button mat-stroked-button color="primary" type="button" (click)="onResendOtp()" [disabled]="countdown > 0">
                Gửi lại OTP {{ countdown > 0 ? '(' + countdown + 's)' : '' }}
            </button>

            <!-- Nút đặt lại mật khẩu -->
            <button mat-raised-button color="primary" type="submit" [disabled]="resetForm.invalid">
                Xác nhận
            </button>
        </form>
    </div>
</div>
