<div class="profile-container">
    <app-profile-menu></app-profile-menu>

    <div class="profile-content">
        <h1 class="profile-title">Thông tin giao hàng</h1>
        <hr class="section-divider" />

        <div class="address-list">
            <mat-card *ngFor="let address of addresses" class="address-card">
                <mat-card-title>
                    {{ address.fullName }}
                    <span *ngIf="address.isDefault" class="default-label">[Địa chỉ mặc định]</span>
                </mat-card-title>

                <mat-card-content>
                    <p>{{ address.phone }}</p>
                    <p>{{ address.address }}</p>
                </mat-card-content>

                <mat-card-actions>
                    <!-- ✅ Nút Cập nhật (mở dialog) -->
                    <button mat-button color="accent" (click)="openDialog(true, address)">
                        Cập nhật
                    </button>

                    <ng-container *ngIf="!address.isDefault">
                        <button mat-button color="primary" (click)="setDefaultAddress(address)">
                            Đặt làm mặc định
                        </button>
                        <button mat-button color="warn" (click)="deleteAddress(address)">Xóa</button>
                    </ng-container>
                </mat-card-actions>
            </mat-card>
        </div>

        <!-- ✅ Nút Thêm địa chỉ (mở dialog) -->
        <button mat-raised-button color="primary" (click)="openDialog(false)">
            Thêm địa chỉ mới
        </button>
    </div>
</div>
