<div class="top-bar">
    <div class="main-wrapper">
        <!-- 🔼 Logo -->
        <div class="logo" routerLink="/">ALMA</div>

        <!-- 🔍 Search -->
        <div class="search">
            <mat-form-field appearance="outline" class="search-field">
                <mat-label>Search for a brand or product…</mat-label>
                <input matInput [(ngModel)]="inputModel" />
            </mat-form-field>
            <button mat-icon-button color="primary">
                <mat-icon>search</mat-icon>
            </button>
        </div>

        <!-- 👤 Tài khoản + Giỏ hàng -->
        <div class="account">
            <a mat-icon-button routerLink="/auth/sign-in" aria-label="Sign In">
                <mat-icon>account_circle</mat-icon>
            </a>
            <a mat-icon-button routerLink="/bag" aria-label="Shopping Bag">
                <mat-icon>shopping_cart</mat-icon>
            </a>
        </div>
    </div>
</div>

<!-- Navigation (menu bên dưới) -->
<div class="navigation">
    <app-user-menu></app-user-menu>
</div>
